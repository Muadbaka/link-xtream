name: link_xtream
description: "Link Xtream — مشغل IPTV احترافي لسطح المكتب ببروتوكول Xtream Codes API"
publish_to: "none"
version: 1.6.8+10

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # إدارة الحالة
  provider: ^6.1.2

  # الاتصال بـ Xtream Codes API
  http: ^1.2.2

  # التخزين المحلي (بيانات الدخول، الإعدادات، المفضلة)
  shared_preferences: ^2.3.3

  # مسارات النظام (مجلد التسجيلات)
  path_provider: ^2.1.4

  # محرك التشغيل media_kit (libmpv) — يدعم M3U8/TS/H.265/MKV
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_windows_video: ^1.0.10
  media_kit_libs_linux: ^1.1.3 # للاختبار داخل لينكس فقط — لا يؤثر على بناء ويندوز

  # نافذة سطح المكتب (العنوان، الحد الأدنى للحجم، ملء الشاشة)
  window_manager: ^0.4.3
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
